name: Run all exercises

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-all-run-sh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: "25"

      - name: Execute every run.sh
        shell: bash
        run: |
          set -u

          mapfile -t scripts < <(find . -type f -name "run.sh" -not -path "./.git/*" | sort)

          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No run.sh scripts found."
            exit 1
          fi

          failed=0
          skipped=0

          for script in "${scripts[@]}"; do
            dir="$(dirname "$script")"

            echo "============================================================"
            echo "Running: $script"

            if [[ -d "$dir/src" ]] && grep -R -q --include="*.java" "Scanner" "$dir/src"; then
              echo "SKIP: $script (Scanner detected in source)"
              skipped=$((skipped + 1))
              if [[ -d "$dir/build" ]]; then
                rm -rf -- "$dir/build"
                echo "CLEANED: $dir/build"
              fi
              continue
            fi

            if (cd "$dir" && bash ./run.sh); then
              echo "PASS: $script"
            else
              echo "FAIL: $script"
              failed=1
            fi

            if [[ -d "$dir/build" ]]; then
              rm -rf -- "$dir/build"
              echo "CLEANED: $dir/build"
            fi
          done

          echo "============================================================"
          echo "Skipped scripts: $skipped"
          if [[ "$failed" -ne 0 ]]; then
            echo "At least one exercise failed."
            exit 1
          fi

          echo "All run.sh scripts passed."
