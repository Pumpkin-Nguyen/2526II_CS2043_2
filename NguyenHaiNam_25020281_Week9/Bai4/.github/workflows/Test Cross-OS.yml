name: Test Cross-OS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # 1. Định nghĩa Matrix Strategy
    strategy:
      # fail-fast: false giúp các OS khác vẫn tiếp tục chạy dù có 1 OS bị lỗi
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Build (Test & Package)
        run: mvn clean test