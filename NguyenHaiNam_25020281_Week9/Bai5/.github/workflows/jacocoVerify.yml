name: jacocoVerify
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Build & Quality Checks
        run: mvn clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        if: always() # QUAN TRỌNG: Đảm bảo luôn upload báo cáo kể cả khi build fail do coverage < 80%
        with:
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/
          retention-days: 7