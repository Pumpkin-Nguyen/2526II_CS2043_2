name: Automated Code Review

# Requirement 1: Trigger on pull_request targeting the main branch
on:
  pull_request:
    branches:
      - main

jobs:
  checkstyle-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Run your linter (Maven Checkstyle in this example)
      - name: Generate Checkstyle Report
        run: mvn checkstyle:checkstyle
        continue-on-error: true # Allows the next step to run even if violations are found

      # Requirement 2: Inline Feedback using dbelyaev/action-checkstyle
      - name: Post Inline Comments on PR
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error
          checkstyle_issues_path: "**/checkstyle-result.xml"